<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vital Force Agro | Premium Nigerian Exports</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0f291e; 
            --accent: #d4a373;  
            --bone: #f9f7f2;    
            --white: #ffffff;
            --text-muted: #5a635e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body { 
            font-family: 'Bricolage Grotesque', sans-serif; 
            background-color: var(--bone); 
            color: var(--primary); 
            line-height: 1.6;
        }

        nav {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 100;
            background: rgba(249, 247, 242, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(15, 41, 30, 0.05);
        }
        .logo { font-family: 'Fraunces', serif; font-size: 1.5rem; color: var(--primary); text-decoration: none; font-weight: 700; }
        
        .hero {
            height: 80vh;
            background: linear-gradient(rgba(15, 41, 30, 0.6), rgba(15, 41, 30, 0.7)), 
                        url('https://images.pexels.com/photos/212324/pexels-photo-212324.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            padding: 0 5%;
        }
        .hero h1 { font-family: 'Fraunces', serif; font-size: clamp(2.5rem, 7vw, 4.5rem); margin-bottom: 1rem; }

        .section { padding: 80px 8%; }
        .section-header { text-align: center; margin-bottom: 3rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .card { background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 250px; object-fit: cover; }
        .card-content { padding: 1.5rem; }
        .card-tag { color: var(--accent); font-weight: 800; text-transform: uppercase; font-size: 0.7rem; }
        
        .btn-wa { 
            background: #25D366; 
            color: white; 
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 1rem;
            font-weight: 600;
        }

        #loading { text-align: center; padding: 50px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo">Vital Force Agro.</a>
</nav>

<section class="hero">
    <h1>The Pulse of Nigerian Agriculture.</h1>
</section>

<section class="section" id="products">
    <div class="section-header">
        <h2>Our Live Inventory</h2>
        <p>Fetched directly from our sourcing desk.</p>
    </div>

    <div id="loading">Loading Products...</div>
    <div class="grid" id="product-container"></div>
</section>

<script>
    // YOUR WORKING BACKEND URL
    const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwutzUHtaTobjk3ce6uOHrIQINsysSXgPwsKKz3GxH8zI02HPGkKFudocW7DAkE03m4/exec';

    async function loadProducts() {
        const container = document.getElementById('product-container');
        const loader = document.getElementById('loading');

        try {
            const response = await fetch(SHEET_API_URL);
            const products = await response.json();
            
            if (loader) loader.style.display = 'none';
            container.innerHTML = ''; 

            products.forEach(item => {
                // Handling your sheet headers
                const name = item.name || "Product";
                const desc = item.description || "";
                const img = item.imageurl || item['image-url'] || 'https://via.placeholder.com/400x300';
                const spec = item.specs || "Grade A";
                const cat = item.category || "Commodity";

                container.innerHTML += `
                    <div class="card">
                        <img src="${img}" alt="${name}" onerror="this.src='https://via.placeholder.com/400x300?text=Invalid+Link'">
                        <div class="card-content">
                            <span class="card-tag">${cat}</span>
                            <h3 style="margin: 5px 0;">${name}</h3>
                            <p style="font-size: 0.9rem; color: #555;">${desc}</p>
                            <p style="font-size: 0.8rem; margin-top: 10px;"><strong>Spec:</strong> ${spec}</p>
                            <a href="https://wa.me/2349050178211?text=Inquiry for ${encodeURIComponent(name)}" class="btn-wa">Order via WhatsApp</a>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            console.error("Load Error:", err);
            if (loader) loader.innerHTML = "Error connecting to sheet.";
        }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
</script>

</body>
</html>
